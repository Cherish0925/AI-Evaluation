name: Evaluation environment
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python examples/run_examples.py
      - run: python -m build
      - run: python scripts/check_distribution.py
  gym:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: evaluation
      - uses: actions/checkout@v4
        with:
          repository: EnvFoundry/Verifiable-Agent-Gym
          ref: 82b7100d88be2d1158d355802e6a864cde1e5684
          path: gym
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          repository: EnvFoundry/Data-Engineering
          ref: c6be7171b6adf643ea3418307d7ad4d168acf033
          path: data
      - run: python -m pip install -e ./evaluation -e ./gym -e ./data
      - run: python evaluation/integration/gym_roundtrip.py --with-data
